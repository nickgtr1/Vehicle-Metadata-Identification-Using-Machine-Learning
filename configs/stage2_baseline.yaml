schema_version: "0.1.0"
random_seed: 36127

colour_baseline:
  method: "central-roi-hsv-v1"
  central_roi:
    x_start: 0.15
    x_end: 0.85
    y_start: 0.30
    y_end: 0.82
  minimum_pixels: 100
  achromatic:
    black_value_max: 45
    white_value_min: 205
    white_saturation_max: 45
    grey_saturation_max: 50
  hue_ranges:
    orange: [10, 20]
    yellow: [20, 35]
    green: [35, 85]
    blue: [85, 130]
    purple: [130, 160]
    pink: [160, 170]

unavailable_models:
  make: "No approved labelled training data or model weights supplied."
  model: "No approved labelled training data or model weights supplied."
  body_type: "No approved labelled training data or model weights supplied."
  damage: "No CarDD data or trained damage model supplied."
  accessories: "No approved accessory taxonomy or trained model supplied."

evidence_notice: >-
  Colour is an unvalidated deterministic image-processing baseline. It is not a
  trained vehicle-colour classifier and must not be reported as model accuracy.
